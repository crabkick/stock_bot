name: Daily Stock Monitor

env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # 🔥 これが必要！

on:
  schedule:
    # UTC時間で23:30 (日本時間 JST 08:30) に実行
    # 月曜〜金曜 (UTC: 日曜〜木曜 23:30)
    - cron: '30 23 * * 0-4'
  workflow_dispatch: # GitHubの画面から手動実行も可能にする設定

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 売りシグナル監視スクリプトの実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python daily_sell.py

      - name: 変更された watchlist.json を自動コミット・Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add watchlist.json
          # 変更がある場合のみコミット
          git diff --staged --quiet || git commit -m "Auto-update watchlist.json [skip ci]"
          git push
