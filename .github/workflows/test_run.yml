name: Test Run Python Script

on:
  workflow_dispatch:
    inputs:
      script_name:
        description: '実行したいPythonファイル名を入力してください (例: get_jpx_stocks.py)'
        required: true

jobs:
  run-test:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pythonスクリプトの実行
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ${{ inputs.script_name }}
