name: Daily eMAXIS_Slim Bot
env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }} # 🔥 これが必要！
on:
  schedule:
    - cron: '15 18 * * 0-4' #日本時間で月から金の深夜3時15分※遅延考慮
  workflow_dispatch: # 手動実行ボタン

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python daily_eMAXIS_Slim.py
